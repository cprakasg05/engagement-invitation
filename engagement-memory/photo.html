<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="script.js" defer></script>
</head>
<body>
  <div class="top-bar">
    <div style="display:flex; gap:10px;">
      <button class="back-btn" onclick="window.location.href='index.html'" style="margin-left: 1rem;">← <span data-key="back">Back</span></button>
      <button class="back-btn" onclick="window.location.href='../index.html'" style="margin-left: 0.5rem; background:#218c5b;">🏠 <span data-key="home">Home</span></button>
    </div>
    <div class="language-toggle">
      <button onclick="setLanguage('en')">English</button>
      <button onclick="setLanguage('ta')">தமிழ்</button>
      <button onclick="setLanguage('ml')">മലയാളം</button>
    </div>
  </div>
  <h2 id="photo-gallery-title" data-key="photos">Photos</h2>
  
  <!-- Full Screen Photo Slideshow Background -->
  <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden;">
    <div style="position: absolute; width: 100%; height: 100%; animation: slideshow 30s infinite;">
      <div style="position: absolute; width: 100%; height: 100%; background-image: url('../asset/eng pho 1.jpg'); background-size: cover; background-position: center; opacity: 1; animation: fade 30s infinite;"></div>
      <div style="position: absolute; width: 100%; height: 100%; background-image: url('../asset/eng pho 2.jpg'); background-size: cover; background-position: center; opacity: 0; animation: fade 30s infinite 5s;"></div>
      <div style="position: absolute; width: 100%; height: 100%; background-image: url('../asset/eng pho 3.jpg'); background-size: cover; background-position: center; opacity: 0; animation: fade 30s infinite 10s;"></div>
      <div style="position: absolute; width: 100%; height: 100%; background-image: url('../asset/eng pho 4.jpg'); background-size: cover; background-position: center; opacity: 0; animation: fade 30s infinite 15s;"></div>
      <div style="position: absolute; width: 100%; height: 100%; background-image: url('../asset/eng pho 5.jpg'); background-size: cover; background-position: center; opacity: 0; animation: fade 30s infinite 20s;"></div>
      <div style="position: absolute; width: 100%; height: 100%; background-image: url('../asset/eng pho 6.jpg'); background-size: cover; background-position: center; opacity: 0; animation: fade 30s infinite 25s;"></div>
    </div>
    <div style="position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.3);"></div>
  </div>
  
  <style>
    @keyframes fade {
      0%, 16.67%, 100% { opacity: 0; }
      3.33%, 13.33% { opacity: 1; }
    }
  </style>
  
  <div class="gallery-box" style="position: relative; z-index: 10; background: rgba(255,255,255,0.95); border-radius: 20px; padding: 3em 2em; margin: 3em auto; max-width: 600px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);">
    <div style="text-align: center;">
      <h2 style="color: #d4af37; margin-bottom: 1em; font-size: 2em;">📸 Engagement Memories</h2>
      <p style="font-size: 1.3em; color: #0f2438; margin-bottom: 1.5em; line-height: 1.6;">
        Please message to receive full media link
      </p>
      <a href="https://wa.me/917339646162?text=Hi%20I%20need%20photo%20access" 
         target="_blank" 
         style="display: inline-block; background: linear-gradient(135deg, #25D366, #128C7E); color: white; padding: 18px 40px; font-size: 1.3em; border-radius: 50px; text-decoration: none; font-weight: 600; box-shadow: 0 6px 20px rgba(37,211,102,0.4); transition: all 0.3s ease;"
         onmouseover="this.style.transform='translateY(-3px)'; this.style.boxShadow='0 8px 25px rgba(37,211,102,0.5)';"
         onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 6px 20px rgba(37,211,102,0.4)';">
        💬 Message on WhatsApp
      </a>
    </div>
  </div>
  <div id="audio-control-wrap">
    <audio id="bg-music" loop autoplay>
      <source src="asset/bg-music.mp3" type="audio/mp3">
    </audio>
    <button id="mute-btn" aria-label="Mute/Unmute">&#128266;</button>
  </div>
</body>
</html>
